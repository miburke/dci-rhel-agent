---
- name: Set provisioner username
  set_fact:
    provisioner_username: "{{ lookup('env', 'DCI_CLIENT_ID') }}"
  no_log: true

- name: Validate DCI_CLIENT_ID is set
  assert:
    that:
      - provisioner_username | length > 0
    fail_msg: "DCI_CLIENT_ID environment variable is not set"

- name: Set provisioner password from DCI_API_SECRET
  set_fact:
    provisioner_password: "{{ lookup('env', 'DCI_API_SECRET') }}"
  no_log: true

- name: Validate DCI_API_SECRET is set
  assert:
    that:
      - provisioner_password | length > 0
    fail_msg: "DCI_API_SECRET environment variable is not set"

- name: Hash the provisioner password with SHA-256
  set_fact:
    provisioner_password_hash: "{{ provisioner_password | hash('sha256') }}"
  no_log: true

- name: Build PROVISIONER_AUTH string with hashed password
  set_fact:
    provisioner_auth: "{{ provisioner_username }}:{{ provisioner_password_hash }}"
  no_log: true