---
- name: Ensure secrets directory exists
  file:
    path: /etc/dci-rhel-agent/secrets
    state: directory
    mode: '0700'

- name: Read DCI_CLIENT_ID from dcirc.sh
  shell: grep '^DCI_CLIENT_ID=' /etc/dci-rhel-agent/dcirc.sh | head -1 | sed "s/DCI_CLIENT_ID=//;s/['\"]//g"
  register: dci_client_id_result
  changed_when: false

- name: Validate DCI_CLIENT_ID was found
  assert:
    that:
      - dci_client_id_result.stdout | length > 0
    fail_msg: "Could not extract DCI_CLIENT_ID from /etc/dci-rhel-agent/dcirc.sh"

- name: Set provisioner username
  set_fact:
    provisioner_username: "{{ dci_client_id_result.stdout }}"

- name: Remove existing provisioner password
  file:
    path: /etc/dci-rhel-agent/secrets/provisioner_auth
    state: absent

- name: Generate provisioner password
  set_fact:
    provisioner_password: "{{ lookup('password', '/etc/dci-rhel-agent/secrets/provisioner_auth length=32 chars=ascii_letters,digits') }}"

- name: Build PROVISIONER_AUTH string
  set_fact:
    provisioner_auth: "{{ provisioner_username }}:{{ provisioner_password }}"
  no_log: true